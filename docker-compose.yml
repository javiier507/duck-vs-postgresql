name: duckdb-postgresql-ensayo
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench_local
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:${PG_PORT:-55433}:5432"
    cpus: 2
    mem_limit: 2g
    shm_size: 512m
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "max_parallel_workers_per_gather=1", "-c", "max_parallel_workers=2", "-c", "max_worker_processes=4", "-c", "jit=off"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30
  herramientas:
    profiles: ["herramientas"]
    build: .
    working_dir: /work
    environment:
      PG_DSN: postgresql://bench:bench_local@postgres:5432/bench
      PYTHONUNBUFFERED: "1"
    cpus: 2
    mem_limit: 2g
    volumes:
      - .:/work
volumes:
  pgdata:
